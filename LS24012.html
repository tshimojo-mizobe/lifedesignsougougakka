<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>うすき Yo 怪ずかん</title>
    <style>
        /* ブラウザ特有の余白を消す */
        body, html {
            margin: 0;
            padding: 0;
            background-color: #f0f0f0; /* 背景色（任意） */
        }

        /* 画像の設定 */
        .full-width-image {
            display: block;    /* 下部の隙間を解消 */
            width: 100%;       /* 横幅をブラウザいっぱいに */
            height: auto;      /* 縦横比を維持 */
            vertical-align: top; /* 上端を揃える */
        }
    </style>
</head>
<body>

    <img src="top.png" alt="表示画像" class="full-width-image">

</body>
</html>
