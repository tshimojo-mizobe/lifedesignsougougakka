<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .image-wrapper {
            width: 100%;
            display: flex;
            justify-content: center; /* 横方向の中央寄せ */
            align-items: center;     /* 必要に応じて縦方向の中央寄せ */
        }

        .full-width-img {
            /* 画面（親要素）の幅いっぱいに表示 */
            width: 100%;
            height: auto; /* アスペクト比を維持 */
            
            /* もしPCなどで画像が広がりすぎるのを防ぎたい場合は、
               以下のコメントアウトを外して数値を調整してください。
            */
            /* max-width: 1200px; */ 
        }
    </style>
</head>
<body>

    <div class="image-wrapper">
        <img src="https://via.placeholder.com/1200x600" alt="全幅画像" class="full-width-img">
    </div>

</body>
</html>
