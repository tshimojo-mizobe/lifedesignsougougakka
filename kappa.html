<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画像の中央配置と部分リンク</title>
    <style>
        /* 1. 画面全体の中央に配置するための設定 */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f0f0; /* 背景色は任意 */
        }

        /* 2. 画像コンテナのサイズ設定 */
        .image-container {
            position: relative;
            width: 90vw; /* 画面幅の90% */
            line-height: 0; /* 下部の隙間を排除 */
        }

        .image-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* 3. 右下4分の1のリンクエリア */
        .click-area {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 50%;  /* 横幅の半分 */
            height: 50%; /* 高さの半分 */
            background-color: rgba(255, 255, 255, 0); /* 完全に透明 */
            cursor: pointer;
            z-index: 10;
        }

        /* デバッグ用：範囲を確認したい場合は下のコメントアウトを外してください */
        /* .click-area { background-color: rgba(255, 0, 0, 0.3); } */
    </style>
</head>
<body>

    <div class="image-container">
        <img src="kappa.png" alt="メイン画像">
        
        <a href="https://example.com" class="click-area"></a>
    </div>

</body>
</html>
