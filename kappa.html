<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>複数エリアのリンク設定</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f5f5f5;
        }

        .image-container {
            position: relative;
            width: 90vw; 
            line-height: 0;
        }

        .image-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* 共通のリンクエリア設定 */
        .click-area {
            position: absolute;
            cursor: pointer;
            /* 開発中のデバッグ用（範囲が見えるようにします） */
            background-color: rgba(255, 0, 0, 0.2); 
            z-index: 10;
        }

        /* エリア1：右下4分の1（さらに一回り小さく設定） */
        .area-bottom-right {
            top: 75%;     /* 上から10%の位置 */
            left: 46%;    /* 左から10%の位置 */
            width: 44%;   /* 横幅の30% */
            height: 7%;  /* 高さの30% */
        }

        /* エリア2：左上の特定位置 */
        .area-custom {
            top: 84%;     /* 上から10%の位置 */
            left: 46%;    /* 左から10%の位置 */
            width: 44%;   /* 横幅の20% */
            height: 7%;  /* 高さの15% */
            background-color: rgba(0, 0, 255, 0.2); /* 別の色でデバッグ */
        }

    </style>
</head>
<body>

    <div class="image-container">
        <img src="kappa.png" alt="メイン画像">
        
        <a href="https://google.com" class="click-area area-bottom-right" title="右下のリンク"></a>

        <a href="https://youtube.com" class="click-area area-custom" title="左上のリンク"></a>
    </div>

</body>
</html>
